defaults:
  - model/pi0_5_rlinf@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor: 0

runner:
  task_type: sft
  logger:
    log_path: ./logs
    project_name: piperx_pi05_rlinf
    experiment_name: piperx_mixed600_official_base
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 5000
  val_check_interval: -1
  save_interval: 5000
  resume_dir: null

data:
  train_data_paths:
    - /home/ajifang/genesis-world/vla/stacking/data/all6_100_20260920_223136_lerobot
    - /home/ajifang/genesis-world/vla/stacking/data/cylinder_rear_50_20260921_0922_lerobot
  cameras: [third_person, wrist]
  num_workers: 2
  piper_specs:
    - source_episodes: 600
      episodes: 500
      frames: 238789
      tasks: 5
      per_task: 100
    - source_episodes: 100
      episodes: 100
      frames: 47100
      tasks: 2
      per_task: 50

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 4
  global_batch_size: 4
  seed: 42
  model:
    model_path: /home/ajifang/models/pi05_base_official_openpi_rlinf
    precision: fp32
    pi05: true
    is_lora: true
    num_action_chunks: 50
    action_dim: 7
    num_steps: 10
    openpi:
      config_name: pi05_piperx
      action_horizon: 50
      discrete_state_input: true
      paligemma_variant: gemma_2b_lora
      action_expert_variant: gemma_300m_lora
      lora_train_vision: true
      lora_train_action_projections: true
      num_images_in_input: 2
      assets_dir: /home/ajifang/models/pi05_base_official_openpi_rlinf
      asset_id: piperx_five_tasks_2views
    openpi_data:
      norm_stats_path: /home/ajifang/models/pi05_base_official_openpi_rlinf/piperx_five_tasks_2views/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: 5000
    lr_warmup_steps: 1000
    lr_scheduler: openpi_cosine
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    # FP32 parameters share block wraps; frozen norms need no separate FSDP wrap.
    wrap_policy:
      transformer_layer_cls_to_wrap: [Block, Encoder1DBlock]
    enable_gradient_accumulation: false
    gradient_checkpointing: true
    gradient_checkpointing_use_reentrant: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    amp_autocast:
      enabled: true
      precision: bf16

reward:
  use_reward_model: false
critic:
  use_critic_model: false
