[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piperx-genesis-data-engine"
version = "1.0.0"
description = "Batched scripted demonstration collection for PiperX stacking in Genesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.scripts]
piperx-collect = "piperx_data_engine.collect:main"
piperx-export-lerobot = "piperx_data_engine.export_lerobot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["piperx_data_engine*"]

[tool.setuptools.package-data]
piperx_data_engine = [
    "assets/piper_x_description/*.md",
    "assets/piper_x_description/urdf/*.urdf",
    "assets/piper_x_description/urdf/*.json",
    "assets/piper_x_description/meshes/dae/*.dae",
    "assets/piper_x_description/meshes/collision/*.obj",
]
