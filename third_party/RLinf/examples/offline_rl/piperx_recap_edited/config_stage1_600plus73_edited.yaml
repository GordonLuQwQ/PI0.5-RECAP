# EDITED: train the Pi0.5-backed value function on 600 demos and all 73 failures.

paths:
  rlinf_root: /path/to/RLinf
  pi05_checkpoint: /path/to/RLinf/logs/20260921-20:49:58-piperx_sft_openpi_pi05_rlinf/piperx_mixed600_official_base/checkpoints/global_step_5000/actor
  norm_stats: /path/to/models/pi05_base_official_openpi_rlinf/piperx_five_tasks_2views/norm_stats.json
  output_dir: /path/to/rlinf-experiments/piperx_recap_value_stage1_600plus73_edited

data:
  datasets:
    - path: /path/to/genesis-world/vla/stacking/data/pi05_value_600success_73failure_lerobot
      type: rollout
      weight: 1.0
  camera_keys:
    third_person: observation.images.image
    wrist: observation.images.image2
  state_key: observation.state
  task_key: task
  returns_tag: piperx_stage1_600plus73_edited
  require_rollout_dataset: true
  video_tolerance_s: 0.03
  video_cache_size: 32

reward:
  step_reward: -1.0
  success_terminal_reward: 0.0
  failure_terminal_reward: -300.0
  gamma: 1.0

normalization:
  normalize_to_minus_one_zero: true
  return_min: null
  return_max: 0.0
  clip: false

value_model:
  train_pi05_vlm_lora: true
  train_vision_encoder: false
  gradient_checkpointing: true
  pooling: mean_token
  hidden_size: 2048
  head_hidden_size: 1024
  dropout: 0.0
  num_bins: 201
  v_min: -1.0
  v_max: 0.0

training:
  seed: 42
  device: cuda
  batch_size: 112
  num_workers: 4
  pin_memory: true
  max_steps: 6683
  learning_rate: 1.0e-4
  vlm_learning_rate: 2.5e-5
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
  log_every: 20
  checkpoint_steps: [3000, 6000]
  resume_from: auto
