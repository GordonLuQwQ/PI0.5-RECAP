# EDITED: all-true advantage stage for the native OpenPI_RLinf Pi0.5.

paths:
  base_pi05_checkpoint: /path/to/RLinf/logs/20260921-20:49:58-piperx_sft_openpi_pi05_rlinf/piperx_mixed600_official_base/checkpoints/global_step_5000/actor
  norm_stats: /path/to/models/pi05_base_official_openpi_rlinf/piperx_five_tasks_2views/norm_stats.json
  dataset: /path/to/genesis-world/vla/stacking/data/pi05_positive_227plus26_lerobot
  output_dir: /path/to/rlinf-experiments/piperx_advantage_stage1_all_true_edited

data:
  cameras: [third_person, wrist]
  num_workers: 2
  video_tolerance_s: 0.03
  video_cache_size: 32
  advantage_tag: piperx_all_true_edited
  prompt_suffix: "\nAdvantage: positive"
  require_all_true: true
  expected_policy_success_episodes: 227
  expected_expert_suffix_episodes: 26

advantage_conditioning:
  # True labels condition on the positive prompt. False labels use the base prompt.
  mode: positive_only
  # Stage one is strictly all-positive; Value VLM-derived 0/1 labels are introduced later.
  unconditional_probability: 0.0

model:
  model_type: openpi_rlinf
  precision: fp32
  pi05: true
  is_lora: true
  lora_rank: 32
  use_proprio: true
  num_action_chunks: 50
  action_dim: 7
  num_steps: 10
  add_value_head: false
  openpi:
    task: sft
    config_name: pi05_piperx
    action_horizon: 50
    action_chunk: 50
    action_env_dim: 7
    model_action_dim: 32
    max_token_len: 200
    discrete_state_input: true
    paligemma_variant: gemma_2b_lora
    action_expert_variant: gemma_300m_lora
    num_images_in_input: 2
    # Strict LoRA pass: keep the already-trained SigLIP encoder frozen.
    lora_train_vision: false
    lora_train_action_projections: true
  openpi_data:
    norm_stats_path: /path/to/models/pi05_base_official_openpi_rlinf/piperx_five_tasks_2views/norm_stats.json

training:
  seed: 42
  device: cuda
  batch_size: 8
  max_steps: 3000
  learning_rate: 2.5e-5
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  weight_decay: 1.0e-10
  grad_clip_norm: 1.0
  warmup_steps: 1000
  min_learning_rate: 2.5e-6
  log_every: 10
  save_only_final: true
