defaults:
  - _self_
  - override hydra/job_logging: stdout

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0

runner:
  task_type: embodied_eval
  only_eval: True
  val_check_interval: -1
  max_epochs: 1
  max_steps: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null
  per_worker_log: False
  stop_eval_on_episode_done: False
  # Official RTC loop: https://rlinf.readthedocs.io/en/latest/rst_source/guides/rtc.html
  rtc:
    enabled: True
    min_exec_horizon: 10
    initial_delay_steps: 35
    delay_buffer_size: 8
    fixed_delay_steps: 0
    chunk_pause_seconds: 0.05
    inject_delay_ms: 0
  logger:
    log_path: ${env.eval.piperx.output_dir}/logs
    project_name: piperx_pi05
    experiment_name: official_rtc_${env.eval.piperx.suite}
    logger_backends: [tensorboard]

algorithm: {}

actor:
  group_name: ActorGroup
  seed: 42
  model:
    model_type: openpi_rlinf
    model_path: ${oc.env:PIPERX_POLICY_CHECKPOINT}
    precision: bf16
    pi05: True
    is_lora: True
    lora_rank: 32
    use_proprio: True
    num_action_chunks: 50
    action_dim: 7
    num_steps: 10
    add_value_head: False
    rewrite_chunk_gripper: False
    openpi:
      task: eval
      config_name: pi05_piperx
      num_images_in_input: 2
      action_chunk: ${actor.model.num_action_chunks}
      action_horizon: 50
      action_env_dim: 7
      model_action_dim: 32
      num_steps: ${actor.model.num_steps}
      paligemma_variant: gemma_2b_lora
      action_expert_variant: gemma_300m_lora
      max_token_len: 200
      discrete_state_input: True
      lora_train_vision: True
      lora_train_action_projections: True
      rtc_enabled: ${runner.rtc.enabled}  # Keep model guidance and worker selection in sync.
      rtc_guidance_mode: exact
      rtc_guidance_clip: 5.0
      rtc_history_horizon: null
    openpi_data:
      norm_stats_path: ${oc.env:PIPERX_NORM_STATS}

rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  generation_backend: huggingface
  pipeline_stage_num: 1
  enable_offload: False
  model: ${actor.model}

env:
  group_name: EnvGroup
  eval:
    env_type: genesis
    seed: 0
    total_num_envs: 1
    group_size: 1
    auto_reset: False
    ignore_terminations: False
    enable_offload: False
    is_eval: True
    use_fixed_reset_state_ids: True
    max_steps_per_rollout_epoch: 600
    max_episode_steps: 600
    rollout_epoch: 60
    video_cfg:
      save_video: False  # The scene records both calibrated camera views.
    init_params:
      task_name: piperx_stacking
    piperx:
      suite: standard
      pairs: [[0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1]]
      seeds: [10000, 10001, 10002, 10003, 10004, 10005, 10006, 10007, 10008, 10009]
      output_dir: ${oc.env:PIPERX_RESULT_ROOT}/${env.eval.piperx.suite}
      project_path: ${oc.env:PIPERX_PROJECT_ROOT}
      python_path: ${oc.env:PIPERX_PYTHON}
      opengl_platform: egl
      bridge_script: ${oc.env:REPO_PATH}/evaluations/piperx/simulator.py
      libstdcpp_path: ${oc.env:PIPERX_LIBSTDCPP_PATH,/usr/lib/x86_64-linux-gnu/libstdc++.so.6}
      calibration: ${oc.env:PIPERX_CALIBRATION}
      cameras: [third_person, wrist]
      fast_chunk_step: False
      parallel_envs: 1
      video_stride: 1
      video_cameras: [third_person, wrist]
      video_failure_only: False
      held_out_task: put the red cube on the red cylinder
      rtc: ${runner.rtc}
      model: ${actor.model}
      placement_rule:
        name: released_on_top_v1
        hold_seconds: 0.0
        stack_xy_tolerance_m: 0.02
        stack_z_tolerance_m: 0.005
        max_gripper_closure: 0.5
        require_object_contact: True
        require_source_robot_contact_free: True
        require_retreat: False
        require_speed_stability: False
        require_third_object_undisturbed: False
        require_destination_unmoved: False
        episode_budget_seconds: 30

reward:
  use_reward_model: False
critic:
  use_critic_model: False
